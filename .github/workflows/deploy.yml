name: Validar e publicar PWA no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  test:
    name: Executar regressões estáticas
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v6

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Executar a suíte de testes
        run: node --test tests/static-pwa.test.mjs

  deploy:
    name: Publicar no GitHub Pages
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter o código
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Montar artefato estático mínimo
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html planner.css planner-service-worker.js planner-manifest.webmanifest _site/
          cp planner-icon.svg planner-icon-192.png planner-icon-512.png .nojekyll _site/
          cp -R modules fonts _site/

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar artefato no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
